  for(let i=0;i<imported.length;i++){
   const n=base+i;

   imported[i].y=70+Math.floor(n/5)*220;
  }
  const previous=oldSelection[oldSelection.length-1];
  if(previous&&imported.length&&data.cards.some(c=>c.id===previous&&c.subject===targetSubject)){
   if(!data.links.some(l=>l.a===previous&&l.b===imported[0].id))data.links.push({a:previous,b:imported[0].id});

  console.error(err);
